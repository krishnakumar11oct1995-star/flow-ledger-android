# Project-wide Gradle settings.

# Enables AndroidX support across all modules and dependencies
android.useAndroidX=true

# Namespaced R classes to improve build speeds and prevent resource collisions
android.nonTransitiveRClass=true

# JVM & Memory configuration for faster Gradle builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official
